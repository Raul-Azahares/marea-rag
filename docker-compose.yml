# Whole stack with one command:  docker compose up --build   (or: make up)
# Then open the UI at http://localhost:3000 (traces: :16686, queues: :5555, API docs: :8000/api/docs).
# Works without any API key: LLM and embeddings default to deterministic fake providers.
# Published ports are bound to 127.0.0.1: nothing is exposed to the local network.
name: marea-rag

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://marea:${POSTGRES_PASSWORD:-marea}@postgres:5432/marea
  REDIS_URL: redis://redis:6379/0
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318

x-backend: &backend
  build:
    context: ./backend
  image: marea-rag-backend:local
  env_file:
    - path: .env          # optional, git-ignored: real provider keys and overrides
      required: false
  environment:
    <<: *backend-env
  restart: unless-stopped

services:
  # ---------------------------------------------------------------- data stores
  # Neither Postgres nor Redis publishes host ports: they are only reachable inside the
  # compose network, and nothing clashes with services already running on the host.
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: marea
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marea}
      POSTGRES_DB: marea
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marea -d marea"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # AOF persistence: queued Celery messages survive a Redis restart.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # -------------------------------------------------------------- observability
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "127.0.0.1:16686:16686"   # Jaeger UI
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector:0.164.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - jaeger
    restart: unless-stopped

  # ---------------------------------------------------------------- application
  # One-shot: applies the database migrations, then exits. Everything that touches the
  # database waits for it, so replicas never race to run migrations.
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    environment:
      <<: *backend-env
      OTEL_SERVICE_NAME: marea-api
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Consumes both queues here. In production `ingest` and `maintenance` would get separate
  # worker pools, scaled independently.
  worker:
    <<: *backend
    command:
      ["celery", "-A", "app.worker.celery_app", "worker",
       "--queues=ingest,maintenance", "--concurrency=2", "--loglevel=INFO"]
    environment:
      <<: *backend-env
      OTEL_SERVICE_NAME: marea-worker
    volumes:
      - uploads:/data/uploads:ro   # least privilege: the worker only reads uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping --destination celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s

  # Schedules the reconciler (re-enqueues stranded documents). Exactly one instance.
  beat:
    <<: *backend
    command:
      ["celery", "-A", "app.worker.celery_app", "beat",
       "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    environment:
      <<: *backend-env
      OTEL_SERVICE_NAME: marea-beat
    depends_on:
      redis:
        condition: service_healthy

  # Celery monitoring UI: queues, workers, task states and retries.
  flower:
    <<: *backend
    command: ["celery", "-A", "app.worker.celery_app", "flower", "--port=5555"]
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      redis:
        condition: service_healthy

  # The UI: the built SPA behind nginx, which also proxies /api to the API (one origin, no
  # CORS). Hardened: read-only filesystem, no Linux capabilities, non-root nginx.
  frontend:
    build:
      context: ./frontend
    image: marea-rag-frontend:local
    ports:
      - "127.0.0.1:3000:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  uploads:
