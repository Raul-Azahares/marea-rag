# Serves the built SPA and proxies /api to the backend: the browser talks to one origin, so
# there is no CORS to configure and the API never needs to be exposed on its own.

# Docker's embedded DNS. Resolving `api` per request (through the variable below) lets nginx
# start before the API and keeps working when the API container is recreated with a new IP.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # 20 MB uploads (MAX_UPLOAD_MB) plus multipart overhead. The API enforces the real limit;
    # this only stops anything absurd at the edge.
    client_max_body_size 21m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;   # no URI part: /api/v1/... is forwarded unchanged
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;   # stream uploads instead of spooling them to disk
        proxy_read_timeout 90s;        # above the API's own 60 s budget for a query
        # Only nosniff here: the SPA's CSP would break the browser's PDF viewer on /file.
        add_header X-Content-Type-Options nosniff always;

        # Errors raised by nginx itself use the API's JSON envelope, so the UI shows a
        # meaningful message instead of an HTML error page.
        error_page 413 = @too_large;
        error_page 502 504 = @api_unreachable;
    }

    location @too_large {
        default_type application/json;
        return 413 '{"error":{"code":"FILE_TOO_LARGE","message":"El archivo supera el tamaño máximo permitido."}}';
    }

    location @api_unreachable {
        default_type application/json;
        add_header Retry-After 5 always;
        return 502 '{"error":{"code":"API_UNREACHABLE","message":"La API no responde. Inténtalo de nuevo en unos segundos."}}';
    }

    # Fingerprinted by Vite (index-<hash>.js): safe to cache forever.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # The SPA. index.html is revalidated on every load so a deploy is picked up at once.
    # (add_header is not inherited by blocks that define their own, hence the repetition.)
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
