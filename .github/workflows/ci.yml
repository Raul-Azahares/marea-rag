name: CI

on:
  push:
  pull_request:

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to full commit SHAs (tags are mutable: see the 2025-2026
# compromises of tj-actions and trivy-action).
jobs:
  backend:
    name: Backend · lint, types, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies (exactly as locked)
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check . && uv run ruff format --check .
          uv run ruff check --config pyproject.toml ../scripts
          uv run ruff format --check --config pyproject.toml ../scripts

      - name: Type-check
        run: uv run mypy app evaluation ../scripts

      - name: Start test infrastructure (Postgres + Redis)
        working-directory: .
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Migrations apply cleanly and match the models
        run: uv run alembic upgrade head && uv run alembic check

      - name: Tests
        run: uv run pytest --cov --cov-report=term-missing

      # The evaluation dataset through the real pipeline with the deterministic providers: a
      # regression in chunking, retrieval, prompting or validation fails the build.
      - name: Evaluation quality gate
        run: uv run python -m evaluation run --gate

      - name: Known vulnerabilities in the runtime dependencies
        working-directory: .
        run: make audit-backend

  frontend:
    name: Frontend · lint, types, tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (exactly as locked, no install scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify registry signatures of the installed packages
        run: npm audit signatures

      - name: Known vulnerabilities in the production dependencies
        run: npm audit --omit=dev

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Type-check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  # The deliverable as shipped: images built from the Dockerfiles, compose wiring, nginx,
  # migrations, the worker consuming from Redis and traces reaching Jaeger.
  smoke:
    name: Smoke · docker compose up, upload, ask, traces
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Exactly what an evaluator runs after cloning: no .env, so the fake providers.
      - name: Build and start the whole stack
        run: docker compose up --build --detach --wait --wait-timeout 600

      - name: Upload a PDF, wait for the worker, ask, find both traces in Jaeger
        run: python3 scripts/smoke_test.py

      - name: Service status and logs
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --timestamps --tail=300

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
