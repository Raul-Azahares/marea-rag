# Throwaway infrastructure for the integration / e2e tests, used both locally and in CI.
#   docker compose -f docker-compose.test.yml up -d --wait     (or: make test-infra)
# Data lives in tmpfs: fast, and gone on `down`. Non-standard host ports avoid clashing
# with a Postgres/Redis already running on the developer's machine.
name: marea-rag-test

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: marea
      POSTGRES_PASSWORD: marea
      POSTGRES_DB: marea_test
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marea -d marea_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
